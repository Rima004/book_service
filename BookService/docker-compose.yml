services:
  web:
    build: .
    container_name: application
    depends_on:
      - db
    volumes:
       - media_volume:/BookService/media
       - static_volume:/BookService/static
  db:
    image: postgres
    container_name: db
    restart: always
    environment:
        POSTGRES_USER: user
        POSTGRES_PASSWORD: password
        POSTGRES_DB: Services
    ports:
        - "5432:5432"
    volumes:
        - postgres_data:/var/lib/postgresql
  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "80:8088"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_volume:/media
      - static_volume:/static
    depends_on:
      - web
  redis:
    image: redis:latest
    container_name: redis_container
    ports:
      - "6379:6379"
  celery:
    build: .
    container_name: celery_worker
    command: celery -A BookService worker -l info
    depends_on:
      - redis
      - db

    


volumes:
  postgres_data:
  media_volume:
  static_volume:



